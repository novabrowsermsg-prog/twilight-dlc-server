<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход в twilightDLC</title>
<style>
  body{margin:0;background:#08051a;color:#f1eaff;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px}
  .card{background:linear-gradient(160deg,rgba(124,58,237,.2),rgba(20,12,43,.9));border:1px solid rgba(164,92,240,.3);border-radius:20px;padding:32px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  h1{margin:0 0 6px;font-size:24px;color:#fff}
  p{color:#9a8cc4;line-height:1.6;margin:0 0 20px}
  .row{display:flex;gap:10px;margin-top:18px}
  button{flex:1;padding:12px;border-radius:10px;border:1px solid rgba(164,92,240,.3);background:transparent;color:#f1eaff;font-size:14px;cursor:pointer;transition:.2s}
  button.primary{background:linear-gradient(135deg,#7c3aed,#a45cf0);border-color:transparent;font-weight:600}
  button:hover:not(:disabled){filter:brightness(1.1)}
  button:disabled{opacity:.6;cursor:default}
  .err{color:#ff9db8;font-size:13px;min-height:18px;margin-top:10px}
  input{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(164,92,240,.3);background:rgba(8,5,26,.6);color:#f1eaff;margin-bottom:10px;box-sizing:border-box}
  input:focus{outline:0;border-color:#a45cf0;box-shadow:0 0 0 3px rgba(164,92,240,.2)}
  .hide{display:none}
  .ok{color:#a7f5c4}
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border:1px solid rgba(164,92,240,.3);border-radius:99px;margin-bottom:20px}
  .tabs button{border:0;background:transparent;padding:9px;border-radius:99px;cursor:pointer;color:#9a8cc4;transition:all .25s;font-size:13px}
  .tabs button.on{background:rgba(124,58,237,.4);color:#fff}
  .code-input{text-align:center;font-size:22px;letter-spacing:8px;font-weight:bold}
</style>
</head>
<body>
<div class="card">
  <h1>twilightDLC</h1>
  <p id="sub">Приложение запрашивает доступ к вашему аккаунту.</p>

  <!-- Шаг 1: вход / регистрация -->
  <div id="form">
    <div class="tabs" id="tabs">
      <button id="tabLogin" class="on">Вход</button>
      <button id="tabReg">Регистрация</button>
    </div>

    <input id="nick" placeholder="Ник" autocomplete="username" spellcheck="false">
    <input id="email" type="email" placeholder="Email" autocomplete="email" class="hide">
    <input id="pw" type="password" placeholder="Пароль" autocomplete="current-password">

    <div class="err" id="err"></div>

    <button id="go" class="primary" style="width:100%">Войти</button>
  </div>

  <!-- Шаг 2: ввод кода -->
  <div id="codeStep" class="hide">
    <p id="codeSub">Мы отправили код на вашу почту.</p>
    <input id="code" type="text" class="code-input" placeholder="000000" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
    <div class="err" id="errCode"></div>
    <button id="confirmBtn" class="primary" style="width:100%">Подтвердить</button>
    <button id="backBtn" style="width:100%;margin-top:10px">Изменить данные</button>
  </div>

  <!-- Шаг 3: разрешение на вход в лаунчер -->
  <div id="approve" class="hide">
    <div class="row">
      <button id="allowBtn" class="primary">Разрешить вход</button>
      <button id="cancelBtn">Отмена</button>
    </div>
  </div>

  <!-- Шаг 4: успех -->
  <div id="done" class="hide">
    <p class="ok">✔ Готово! Вернитесь в лаунчер.</p>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const code = params.get("code");
const $ = (id) => document.getElementById(id);

let mode = "in"; // "in" | "up"
let pendingReg = null; // { nick, email, password }

function setError(msg) { $("err").textContent = msg || ""; }
function setCodeError(msg) { $("errCode").textContent = msg || ""; }

async function api(path, opts = {}) {
  const res = await fetch(path, {
    method: opts.method || "GET",
    headers: { "Content-Type": "application/json", ...(opts.headers || {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Ошибка ${res.status}`);
  return data;
}

function getToken() { return localStorage.getItem("tdlc_token"); }

function showApprove() {
  $("form").classList.add("hide");
  $("codeStep").classList.add("hide");
  $("approve").classList.remove("hide");
  $("sub").textContent = "Подтвердите вход в лаунчер twilightDLC";
}

function showCodeStep() {
  $("form").classList.add("hide");
  $("codeStep").classList.remove("hide");
  $("sub").textContent = "Проверьте почту";
  $("codeSub").textContent = "Мы отправили 6-значный код на " + pendingReg.email;
  $("code").value = "";
  setCodeError("");
  $("code").focus();
}

function showForm() {
  $("codeStep").classList.add("hide");
  $("form").classList.remove("hide");
  $("sub").textContent = "Приложение запрашивает доступ к вашему аккаунту.";
}

// Переключение вкладок
$("tabLogin").onclick = () => {
  mode = "in";
  $("tabLogin").classList.add("on");
  $("tabReg").classList.remove("on");
  $("email").classList.add("hide");
  $("go").textContent = "Войти";
  $("pw").setAttribute("autocomplete", "current-password");
  setError("");
};
$("tabReg").onclick = () => {
  mode = "up";
  $("tabReg").classList.add("on");
  $("tabLogin").classList.remove("on");
  $("email").classList.remove("hide");
  $("go").textContent = "Создать аккаунт";
  $("pw").setAttribute("autocomplete", "new-password");
  setError("");
};

// Основная кнопка
$("go").onclick = async () => {
  const nick = $("nick").value.trim();
  const pw = $("pw").value;
  setError("");

  if (mode === "in") {
    // Вход
    if (!nick || !pw) { setError("Заполните все поля"); return; }
    $("go").disabled = true;
    $("go").textContent = "Входим…";
    try {
      const data = await api("/api/auth/login", {
        method: "POST",
        body: { nick, password: pw },
      });
      localStorage.setItem("tdlc_token", data.token);
      showApprove();
    } catch (e) {
      setError(e.message);
      $("go").disabled = false;
      $("go").textContent = "Войти";
    }
    return;
  }

  // Регистрация — отправляем код
  const email = $("email").value.trim();
  if (!nick) { setError("Введите ник"); return; }
  if (!/^[A-Za-z0-9_]{3,16}$/.test(nick)) { setError("Ник: 3–16 символов, латиница, цифры и _"); return; }
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setError("Введите корректный email"); return; }
  if (pw.length < 6) { setError("Пароль минимум 6 символов"); return; }

  $("go").disabled = true;
  $("go").textContent = "Отправляем код…";

  try {
    await api("/api/auth/send-code", { method: "POST", body: { email } });
    pendingReg = { nick, email, password: pw };
    showCodeStep();
    $("go").disabled = false;
    $("go").textContent = "Создать аккаунт";
  } catch (e) {
    setError(e.message);
    $("go").disabled = false;
    $("go").textContent = "Создать аккаунт";
  }
};

// Подтверждение кода
$("confirmBtn").onclick = async () => {
  const codeVal = $("code").value.trim();
  setCodeError("");
  if (!codeVal || codeVal.length !== 6) { setCodeError("Введите 6-значный код"); return; }

  $("confirmBtn").disabled = true;
  $("confirmBtn").textContent = "Проверяем…";

  try {
    const data = await api("/api/auth/register", {
      method: "POST",
      body: {
        nick: pendingReg.nick,
        password: pendingReg.password,
        email: pendingReg.email,
        code: codeVal,
      },
    });
    localStorage.setItem("tdlc_token", data.token);
    pendingReg = null;
    showApprove();
  } catch (e) {
    setCodeError(e.message);
    $("confirmBtn").disabled = false;
    $("confirmBtn").textContent = "Подтвердить";
  }
};

// Назад к форме
$("backBtn").onclick = () => {
  showForm();
  // Восстанавливаем введённые данные
  if (pendingReg) {
    $("nick").value = pendingReg.nick;
    $("email").value = pendingReg.email;
    $("pw").value = pendingReg.password;
  }
};

// Разрешить вход
$("allowBtn").onclick = async () => {
  const token = getToken();
  try {
    await api("/api/launcher/approve", {
      method: "POST",
      headers: { Authorization: "Bearer " + token },
      body: { code },
    });
    $("approve").classList.add("hide");
    $("done").classList.remove("hide");
    $("sub").textContent = "Можно закрыть вкладку";
  } catch (e) { setError(e.message); }
};

// Отмена
$("cancelBtn").onclick = () => {
  $("approve").classList.add("hide");
  showForm();
};

// При загрузке: если уже авторизован — сразу показать «Разрешить»
(async () => {
  if (!code) { $("sub").textContent = "Ошибка: code отсутствует"; return; }
  const token = getToken();
  if (!token) return;
  try {
    await api("/api/auth/me", { headers: { Authorization: "Bearer " + token } });
    showApprove();
  } catch {
    localStorage.removeItem("tdlc_token");
  }
})();

// Enter в полях
["nick", "email", "pw"].forEach((id) => {
  $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") $("go").click(); });
});
$("code").addEventListener("keydown", (e) => { if (e.key === "Enter") $("confirmBtn").click(); });
</script>
</body>
</html>
